spring:
  application:
    name: tournamentSatelliteSatellite
  datasource:
    url: jdbc:postgresql://localhost:5432/${spring.application.name}db

  cloud:
    function:
      definition: commandResponseChannel;tournamentSatelliteSatelliteServiceCommandChannel;tournamentSatelliteSatelliteEventSubscriber;
    stream:
      bindings:
        tournamentSatelliteSatellite-command-channel:
          destination: ${spring.application.name}-command-channel
        tournamentSatelliteSatelliteServiceCommandChannel-in-0:
          destination: ${spring.application.name}-command-channel
          group: ${spring.application.name}-service-group
        commandResponseChannel-in-0:
          destination: ${spring.application.name}-command-responses
          group: ${spring.application.name}-response-group
        tournamentSatelliteSatelliteEventSubscriber-in-0:
          destination: event-channel
          group: ${spring.application.name}-service-group

server:
  port: 8092
grpc:
  server:
    port: 9102
