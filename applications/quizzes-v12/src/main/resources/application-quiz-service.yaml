spring:
  application:
    name: quiz
  datasource:
    url: jdbc:postgresql://localhost:5432/${spring.application.name}db

  cloud:
    function:
      # answerServiceCommandChannel adopted from the dissolved answer service (merge quiz <- answer):
      # a safety net so a stray sender to answer-command-channel is still served in-process
      definition: commandResponseChannel;quizServiceCommandChannel;answerServiceCommandChannel;quizEventSubscriber;
    stream:
      bindings:
        quiz-command-channel:
          destination: ${spring.application.name}-command-channel
        quizServiceCommandChannel-in-0:
          destination: ${spring.application.name}-command-channel
          group: ${spring.application.name}-service-group
        commandResponseChannel-in-0:
          destination: ${spring.application.name}-command-responses
          group: ${spring.application.name}-response-group
        quizEventSubscriber-in-0:
          destination: event-channel
          group: ${spring.application.name}-service-group

server:
  port: 8085
grpc:
  server:
    port: 9095

routes:
  - id: ${spring.application.name}-service
    uri: lb://${spring.application.name}${gateway.service-suffix}
    predicates:
      - Path=/quizzes/**
    order: 7

  - id: ${spring.application.name}-service-execution-post
    uri: lb://${spring.application.name}${gateway.service-suffix}
    predicates:
      - Method=POST
      - Path=/executions/{executionId}
    order: 9

  # adopted from the dissolved answer service (merge quiz <- answer); distinct id so the
  # gateway keeps both routes
  - id: ${spring.application.name}-service-answer
    uri: lb://${spring.application.name}${gateway.service-suffix}
    predicates:
      - Path=/quizzes/*/answer
    order: 5
