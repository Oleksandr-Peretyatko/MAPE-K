spring:
  application:
    name: course
  datasource:
    url: jdbc:postgresql://localhost:5432/${spring.application.name}db

  cloud:
    function:
      definition: commandResponseChannel;courseServiceCommandChannel;questionServiceCommandChannel;topicServiceCommandChannel;courseEventSubscriber;
    stream:
      bindings:
        course-command-channel:
          destination: ${spring.application.name}-command-channel
        courseServiceCommandChannel-in-0:
          destination: ${spring.application.name}-command-channel
          group: ${spring.application.name}-service-group
        commandResponseChannel-in-0:
          destination: ${spring.application.name}-command-responses
          group: ${spring.application.name}-response-group
        courseEventSubscriber-in-0:
          destination: event-channel
          group: ${spring.application.name}-service-group

server:
  port: 8089
grpc:
  server:
    port: 9099

routes:
  # adopted from the dissolved topic-service so /topics/** keeps answering
  - id: ${spring.application.name}-service-topic
    uri: lb://${spring.application.name}${gateway.service-suffix}
    predicates:
      - Path=/courses/*/topics/**, /courses/*/create, /topics/**
    order: 3
  # adopted from the dissolved question-service so /questions/** keeps answering
  - id: ${spring.application.name}-service-question
    uri: lb://${spring.application.name}${gateway.service-suffix}
    predicates:
      - Path=/questions/**, /courses/*/questions/**
    order: 4
