spring:
  application:
    name: tournamentSatelliteSatellite
  datasource:
    # not ${spring.application.name}db — the camel-case service name is not a legal
    # postgres database name; the compose env var points here too
    url: jdbc:postgresql://localhost:5432/tournamentsatellitesatellitedb

  cloud:
    function:
      definition: commandResponseChannel;tournamentSatelliteSatelliteServiceCommandChannel;tournamentSatelliteSatelliteEventSubscriber;
    stream:
      bindings:
        tournamentSatelliteSatellite-command-channel:
          destination: ${spring.application.name}-command-channel
        tournamentSatelliteSatelliteServiceCommandChannel-in-0:
          destination: ${spring.application.name}-command-channel
          group: ${spring.application.name}-service-group
        commandResponseChannel-in-0:
          destination: ${spring.application.name}-command-responses
          group: ${spring.application.name}-response-group
        tournamentSatelliteSatelliteEventSubscriber-in-0:
          destination: event-channel
          group: ${spring.application.name}-service-group

server:
  port: 8092
grpc:
  server:
    port: 9102

# the participant-facing paths carved out of tournament-satellite's routes —
# more specific predicates, so the order sits below the core satellite's (-4)
routes:
  - id: ${spring.application.name}-service
    uri: lb://${spring.application.name}${gateway.service-suffix}
    predicates:
      - Path=/tournaments/*/join, /tournaments/*/leave, /tournaments/*/solveQuiz, /tournaments/*/user/**, /tournamentSatelliteSatellite/process/**
    order: -14
